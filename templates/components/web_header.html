{# Web Header Component - Uses external CSS from main.css #}
<header class="header">
    <div class="header-container">
        <div>
            <a href="/">
                <img src="{{ url_for('static', path='/images/logo-scientifx.png') }}" alt="Scientifics.io" class="logo">
            </a>
        </div>
        <nav class="nav">
            <a href="/">Home</a>
            <a href="/docs">API Docs</a>
            {% if user_authenticated %}
                <a href="/dashboard">Dashboard</a>
                <a href="/profile">Profile</a>
                <a href="/billing">Billing</a>
                <a href="/logout">Logout</a>
            {% else %}
                <a href="/login">Login</a>
                <a href="/v1/auth/signup">Register</a>
            {% endif %}
        </nav>
    </div>
</header>
