{% extends "layouts/base_web.html" %}

{% block title %}Logging Out - BoloAPI{% endblock %}

{% block content %}
<div class="content">
    <div class="text-center">
        <h2>Logging Out...</h2>
        <p class="text-muted">Please wait while we log you out.</p>
    </div>
</div>

<script>
// Clear localStorage authentication tokens (for API calls)
localStorage.removeItem('access_token');
localStorage.removeItem('user_role');
localStorage.removeItem('user_email');

// Clear the auth cookie by setting it to expire immediately
document.cookie = 'auth_token=; path=/; max-age=0; samesite=lax';

// Redirect to home page after a brief moment
setTimeout(() => {
    window.location.href = '/';
}, 1000);
</script>
{% endblock %}
