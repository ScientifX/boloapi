<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Scientifics.io{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/css/main.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-container">
            <div>
                <img src="{{ url_for('static', path='/images/logo.png') }}" alt="Scientifics.io" class="logo">
            </div>
            <nav class="nav">
                {% block navigation %}
                <a href="/">Home</a>
                <a href="/docs">API Docs</a>
                {% endblock %}
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-container">
            {% block footer %}
            <p>&copy; 2024 Scientifics.io. All rights reserved.</p>
            <p>
                <a href="/docs">API Documentation</a> | 
                <a href="/terms">Terms of Service</a> | 
                <a href="/privacy">Privacy Policy</a>
            </p>
            {% endblock %}
        </div>
    </footer>

    {% block extra_js %}{% endblock %}
</body>
</html>
