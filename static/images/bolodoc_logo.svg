<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 50">
  <defs>
    <linearGradient id="eyeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e8e9ed;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8e9ed;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Text: BoloD -->
  <text x="5" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" fill="#ffffff">BoloD</text>
  
  <!-- Eye icon replacing O - tight against D -->
  <g transform="translate(82, 13)">
    <!-- Eye outline -->
    <path d="M12 4 C5 4 0 12 0 12 C0 12 5 20 12 20 C19 20 24 12 24 12 C24 12 19 4 12 4 Z" 
          fill="url(#eyeGrad)"/>
    <!-- Inner eye - darker for contrast -->
    <ellipse cx="12" cy="12" rx="7" ry="6" fill="#3d4461"/>
    <!-- Iris -->
    <circle cx="12" cy="12" r="5" fill="#f8f9fa"/>
    <!-- Pupil -->
    <circle cx="12" cy="12" r="2.5" fill="#3d4461"/>
    <!-- Scan lines across iris -->
    <line x1="7" y1="12" x2="17" y2="12" stroke="#3d4461" stroke-width="0.4" opacity="0.4"/>
    <line x1="12" y1="7" x2="12" y2="17" stroke="#3d4461" stroke-width="0.4" opacity="0.4"/>
  </g>
  
  <!-- Text: c - tight against eye -->
  <text x="105" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" fill="#e8e9ed">c</text>
</svg>
