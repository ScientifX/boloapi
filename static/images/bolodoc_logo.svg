<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 50">
  <defs>
    <linearGradient id="grad5light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e8e9ed;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8e9ed;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Icon: Stylized eye/iris - light version -->
  <g transform="translate(3, 5)">
    <!-- Eye outline -->
    <path d="M20 8 C8 8 0 20 0 20 C0 20 8 32 20 32 C32 32 40 20 40 20 C40 20 32 8 20 8 Z" 
          fill="url(#grad5light)"/>
    <!-- Inner eye - darker for contrast -->
    <ellipse cx="20" cy="20" rx="12" ry="10" fill="#3d4461"/>
    <!-- Iris -->
    <circle cx="20" cy="20" r="8" fill="#f8f9fa"/>
    <!-- Pupil -->
    <circle cx="20" cy="20" r="4" fill="#3d4461"/>
    <!-- Light reflection -->
    <circle cx="17" cy="17" r="2" fill="#ffffff" opacity="0.9"/>
    <!-- Scan lines across iris -->
    <line x1="12" y1="20" x2="28" y2="20" stroke="#3d4461" stroke-width="0.5" opacity="0.4"/>
    <line x1="20" y1="12" x2="20" y2="28" stroke="#3d4461" stroke-width="0.5" opacity="0.4"/>
  </g>
  
  <!-- Text: BoloDoc - white for dark background -->
  <text x="52" y="33" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="700" fill="#ffffff">
    <tspan>Bolo</tspan><tspan fill="#e8e9ed">Doc</tspan>
  </text>
</svg>
